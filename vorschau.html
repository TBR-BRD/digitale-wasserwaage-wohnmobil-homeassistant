<!DOCTYPE html>
<html lang="de"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Womo Wasserwaage – Vorschau</title>
<style>
  :root { --primary-text-color:#212121; --secondary-text-color:#727272; --primary-color:#03a9f4;
          --card-bg:#fff; --page-bg:#f2f2f6; }
  body.dark { --primary-text-color:#e1e1e1; --secondary-text-color:#9b9b9b; --card-bg:#1c1c1c; --page-bg:#111; }
  body { margin:0; background:var(--page-bg); font-family: -apple-system, Roboto, "Segoe UI", sans-serif;
         color:var(--primary-text-color); }
  .wrap { max-width:420px; margin:0 auto; padding:16px; }
  ha-card { display:block; background:var(--card-bg); border-radius:12px; box-shadow:0 1px 4px rgba(0,0,0,.12); }
  .ctrl { background:var(--card-bg); border-radius:12px; padding:12px 14px; margin-bottom:14px; font-size:14px; }
  .ctrl label { display:flex; align-items:center; gap:10px; margin:6px 0; }
  .ctrl input[type=range] { flex:1; }
  .ctrl output { width:52px; text-align:right; font-variant-numeric: tabular-nums; }
  .ctrl .row { display:flex; gap:8px; flex-wrap:wrap; margin-top:8px; }
  .ctrl button { border:1px solid #ccc; background:transparent; color:inherit; border-radius:6px; padding:5px 9px; font:inherit; font-size:13px; cursor:pointer; }
  h1 { font-size:15px; margin:0 0 6px; }
</style></head>
<body>
<div class="wrap">
  <div class="ctrl">
    <h1>Vorschau mit Testwerten</h1>
    <label>Längs <input id="p" type="range" min="-4" max="4" step="0.1" value="-0.6"><output id="po"></output></label>
    <label>Quer <input id="r" type="range" min="-4" max="4" step="0.1" value="1.1"><output id="ro"></output></label>
    <div class="row">
      <button data-p="0" data-r="0">Waagerecht</button>
      <button data-p="-0.6" data-r="1.1">Typischer Stellplatz</button>
      <button data-p="2.5" data-r="-3">Zu steil</button>
      <button id="dark">Hell/Dunkel</button>
    </div>
  </div>
  <womo-level-card id="card"></womo-level-card>
</div>
<script>
customElements.define("ha-card", class extends HTMLElement {});
/*
 * womo-level-card – Wasserwaage für Wohnmobile in Home Assistant
 * Ansichten: Übersicht (Rück- + Seitenansicht) und Draufsicht
 *
 * Konvention der Sensoren:
 *   Längsneigung (pitch)  > 0  => Front steht höher
 *   Querneigung  (roll)   > 0  => rechte Seite (in Fahrtrichtung) steht höher
 * Falls dein Sensor andersherum misst: invert_pitch / invert_roll: true
 *
 * Nivelliert wird nur mit Keilen => es wird ausschließlich "anheben" angezeigt.
 */

const DEFAULTS = {
  title: "Wasserwaage",
  wheelbase: 395,     // cm, Benimar Tessoro 488 (Ford Transit)
  track: 170,         // cm, Spurbreite (bitte nachmessen)
  tolerance: 0.3,     // Grad – innerhalb gilt "waagerecht"
  max_wedge: 10,      // cm – höchste Stufe deiner Keile
  min_lift: 0.5,      // cm – kleinere Werte werden ignoriert
  exaggerate: 4,      // Neigung im Bild x-fach übertreiben
  bubble_range: 3,    // Grad bis die Blase am Rand ist
  invert_pitch: false,
  invert_roll: false,
  default_view: "overview",
};

const fmt = (v, d = 1) =>
  Number(v).toLocaleString("de-DE", { minimumFractionDigits: d, maximumFractionDigits: d });

const rad = (deg) => (deg * Math.PI) / 180;

/* Rechnet aus Neigung die nötige Keilhöhe je Rad (nur anheben). */
function computeLevel(pitch, roll, cfg) {
  const L = cfg.wheelbase, T = cfg.track;
  const tp = Math.tan(rad(pitch)), tr = Math.tan(rad(roll));
  const z = {
    fl: (L / 2) * tp - (T / 2) * tr,
    fr: (L / 2) * tp + (T / 2) * tr,
    rl: (-L / 2) * tp - (T / 2) * tr,
    rr: (-L / 2) * tp + (T / 2) * tr,
  };
  const top = Math.max(...Object.values(z));
  const lift = {};
  for (const k in z) lift[k] = top - z[k];
  return {
    lift,
    rollLift: T * Math.abs(tr),   // Rückansicht: tiefe Seite anheben
    pitchLift: L * Math.abs(tp),  // Seitenansicht: tiefes Ende anheben
    level: Math.abs(pitch) <= cfg.tolerance && Math.abs(roll) <= cfg.tolerance,
    tooSteep: top - Math.min(...Object.values(z)) > cfg.max_wedge,
  };
}

const WHEEL_NAMES = { fl: "Vorne links", fr: "Vorne rechts", rl: "Hinten links", rr: "Hinten rechts" };

class WomoLevelCard extends HTMLElement {
  constructor() {
    super();
    this.attachShadow({ mode: "open" });
    this._view = null;
    this._last = "";
  }

  static getStubConfig() {
    return {
      pitch_entity: "sensor.womo_level_neigung_laengs",
      roll_entity: "sensor.womo_level_neigung_quer",
      wheelbase: 395,
      track: 170,
    };
  }

  setConfig(config) {
    if (!config.pitch_entity || !config.roll_entity) {
      throw new Error("pitch_entity und roll_entity müssen angegeben werden");
    }
    this._cfg = { ...DEFAULTS, ...config };
    this._view = this._view || this._cfg.default_view;
    this._last = "";
    if (this._hass) this._render();
  }

  set hass(hass) {
    this._hass = hass;
    const p = hass.states[this._cfg.pitch_entity];
    const r = hass.states[this._cfg.roll_entity];
    const key = `${p && p.state}|${r && r.state}|${this._view}`;
    if (key === this._last) return;
    this._last = key;
    this._render();
  }

  getCardSize() {
    return 8;
  }

  _readAngles() {
    const s = (id) => this._hass && this._hass.states[id];
    const p = s(this._cfg.pitch_entity), r = s(this._cfg.roll_entity);
    const pv = p ? parseFloat(p.state) : NaN;
    const rv = r ? parseFloat(r.state) : NaN;
    if (isNaN(pv) || isNaN(rv)) return null;
    return {
      pitch: this._cfg.invert_pitch ? -pv : pv,
      roll: this._cfg.invert_roll ? -rv : rv,
    };
  }

  _render() {
    if (!this._cfg || !this._hass) return;
    const a = this._readAngles();
    const c = this._cfg;

    let body;
    if (!a) {
      body = `<div class="na">Sensor nicht verfügbar</div>`;
    } else {
      const res = computeLevel(a.pitch, a.roll, c);
      body =
        (this._view === "top" ? this._topView(a, res) : this._overview(a, res)) +
        this._status(res);
    }

    this.shadowRoot.innerHTML = `
      <style>${STYLE}</style>
      <ha-card>
        <div class="head">
          <span class="title">${c.title}</span>
        </div>
        <div class="tabs">
          <button data-v="overview" class="${this._view !== "top" ? "on" : ""}">Rück- & Seitenansicht</button>
          <button data-v="top" class="${this._view === "top" ? "on" : ""}">Draufsicht</button>
        </div>
        ${body}
      </ha-card>`;

    this.shadowRoot.querySelectorAll(".tabs button").forEach((b) =>
      b.addEventListener("click", () => {
        this._view = b.dataset.v;
        this._last = "";
        this._render();
      })
    );
  }

  _color(res, liftCm) {
    if (liftCm !== undefined) {
      if (liftCm > this._cfg.max_wedge) return "var(--wl-red)";
      return liftCm < this._cfg.min_lift ? "var(--wl-green)" : "var(--wl-orange)";
    }
    if (res.tooSteep) return "var(--wl-red)";
    return res.level ? "var(--wl-green)" : "var(--wl-orange)";
  }

  /* ---------- Rück- und Seitenansicht ---------- */
  _overview(a, res) {
    const c = this._cfg;
    const clampVis = (deg) => Math.max(-14, Math.min(14, deg * c.exaggerate));

    const rollOk = Math.abs(a.roll) <= c.tolerance;
    const pitchOk = Math.abs(a.pitch) <= c.tolerance;
    const rollCol = res.tooSteep ? "var(--wl-red)" : rollOk ? "var(--wl-green)" : "var(--wl-orange)";
    const pitchCol = res.tooSteep ? "var(--wl-red)" : pitchOk ? "var(--wl-green)" : "var(--wl-orange)";

    // Rückansicht: rechte Seite höher => Bild gegen den Uhrzeigersinn drehen
    const rollVis = -clampVis(a.roll);
    const rollLowRight = a.roll > 0 ? false : true; // tiefe Seite
    const rollLabel = rollOk
      ? `<text x="180" y="186" class="gtxt" text-anchor="middle">waagerecht ✓</text>`
      : this._liftLabel(res.rollLift, rollLowRight ? "right" : "left");

    // Seitenansicht: Front (rechts im Bild) höher => gegen den Uhrzeigersinn
    const pitchVis = -clampVis(a.pitch);
    const pitchLowFront = a.pitch < 0;
    const pitchLabel = pitchOk
      ? `<text x="180" y="186" class="gtxt" text-anchor="middle">waagerecht ✓</text>`
      : this._liftLabel(res.pitchLift, pitchLowFront ? "right" : "left");

    return `
      <div class="panel">
        <div class="ptitle">Rückansicht</div>
        <div class="angle">${ANGLE_ICON} ${fmt(Math.abs(a.roll))}°</div>
        <svg viewBox="0 0 360 200" class="scene">
          <text x="14" y="40" class="side">Links</text>
          <text x="346" y="40" class="side" text-anchor="end">Rechts</text>
          <g transform="rotate(${rollVis} 180 150)">
            <rect x="-300" y="150" width="960" height="200" fill="${rollCol}"/>
            ${REAR_VAN}
          </g>
          ${rollLabel}
        </svg>
      </div>
      <div class="panel">
        <div class="ptitle">Seitenansicht</div>
        <div class="angle">${ANGLE_ICON} ${fmt(Math.abs(a.pitch))}°</div>
        <svg viewBox="0 0 360 200" class="scene">
          <text x="14" y="40" class="side">Hinten</text>
          <text x="346" y="40" class="side" text-anchor="end">Vorne</text>
          <g transform="rotate(${pitchVis} 180 150)">
            <rect x="-300" y="150" width="960" height="200" fill="${pitchCol}"/>
            ${SIDE_VAN}
          </g>
          ${pitchLabel}
        </svg>
      </div>`;
  }

  _liftLabel(cm, side) {
    const x = side === "right" ? 340 : 20;
    const anchor = side === "right" ? "end" : "start";
    const arrowX = side === "right" ? x - 6 : x + 6;
    const textX = side === "right" ? x - 26 : x + 26;
    return `
      <g class="lift">
        <path d="M${arrowX} 194 v-18 m-8 8 l8 -8 l8 8" stroke="#fff" stroke-width="4" fill="none"
              stroke-linecap="round" stroke-linejoin="round"/>
        <text x="${textX}" y="190" class="gtxt" text-anchor="${anchor}">${fmt(cm)} cm</text>
      </g>`;
  }

  /* ---------- Draufsicht ---------- */
  _topView(a, res) {
    const c = this._cfg;
    // Blase wandert zur höheren Seite
    let bx = a.roll / c.bubble_range, by = -a.pitch / c.bubble_range;
    const m = Math.hypot(bx, by);
    if (m > 1) { bx /= m; by /= m; }
    const R = 52;
    const cx = 180 + bx * R, cy = 175 + by * R;

    const cell = (k, x, y, anchor) => {
      const v = res.lift[k];
      const col = this._color(res, v);
      const val = v < c.min_lift ? "0,0" : fmt(v);
      const arrow = v < c.min_lift ? "" : " ↑";
      return `<text x="${x}" y="${y}" class="topval" text-anchor="${anchor}" fill="${col}">${val} cm${arrow}</text>`;
    };

    return `
      <div class="panel">
        <div class="angle">Längs ${fmt(a.pitch)}° · Quer ${fmt(a.roll)}°</div>
        <svg viewBox="0 0 360 350" class="scene top">
          <text x="180" y="20" class="side" text-anchor="middle">Vorne</text>
          <text x="180" y="342" class="side" text-anchor="middle">Hinten</text>
          <!-- Fahrzeugumriss -->
          <rect x="125" y="30" width="110" height="292" rx="22" class="outline"/>
          <rect x="135" y="40" width="90" height="34" rx="10" class="outline thin"/>
          ${["fl", "fr", "rl", "rr"].map((k) => {
            const x = k[1] === "l" ? 113 : 231;
            const y = k[0] === "f" ? 72 : 238;
            return `<rect x="${x}" y="${y}" width="16" height="40" rx="4" fill="${this._color(res, res.lift[k])}"/>`;
          }).join("")}
          ${cell("fl", 104, 98, "end")}
          ${cell("fr", 256, 98, "start")}
          ${cell("rl", 104, 264, "end")}
          ${cell("rr", 256, 264, "start")}
          <!-- Libelle -->
          <circle cx="180" cy="175" r="${R + 12}" class="vial"/>
          <circle cx="180" cy="175" r="${(c.tolerance / c.bubble_range) * R + 9}" class="target"/>
          <line x1="180" y1="${175 - R - 12}" x2="180" y2="${175 + R + 12}" class="cross"/>
          <line x1="${180 - R - 12}" y1="175" x2="${180 + R + 12}" y2="175" class="cross"/>
          <circle cx="${cx}" cy="${cy}" r="9" fill="${res.level ? "var(--wl-green)" : "var(--wl-bubble)"}"/>
        </svg>
      </div>`;
  }

  _status(res) {
    const c = this._cfg;
    if (res.tooSteep) {
      return `<div class="status red">Zu steil für ${fmt(c.max_wedge, 0)} cm Keile – anderen Stellplatz suchen</div>`;
    }
    if (res.level) return `<div class="status green">✓ Steht waagerecht</div>`;
    const list = Object.keys(res.lift)
      .filter((k) => res.lift[k] >= c.min_lift)
      .sort((x, y) => res.lift[y] - res.lift[x])
      .map((k) => `<div class="li"><span>${WHEEL_NAMES[k]}</span><b>${fmt(res.lift[k])} cm</b></div>`);
    if (!list.length) return `<div class="status green">✓ Fast waagerecht – Keile nicht nötig</div>`;
    return `<div class="status orange"><div class="sh">Keile unterlegen</div>${list.join("")}</div>`;
  }
}

/* ---------- Grafiken (eigene, schlichte Silhouetten) ---------- */

const ANGLE_ICON = `<svg viewBox="0 0 20 16" class="aicon"><path d="M2 2 V14 H18 M2 9 A6 6 0 0 1 8 14" fill="none" stroke="currentColor" stroke-width="1.6"/></svg>`;

// Teilintegrierter von hinten, steht mit den Rädern auf y=150, Mitte x=180
const REAR_VAN = `
  <g class="van">
    <rect x="160" y="44" width="40" height="8" rx="2" class="vdark"/>
    <rect x="122" y="52" width="116" height="86" rx="12" class="vbody"/>
    <rect x="150" y="64" width="60" height="30" rx="5" class="vwin"/>
    <rect x="128" y="100" width="9" height="24" rx="2" class="vlight"/>
    <rect x="223" y="100" width="9" height="24" rx="2" class="vlight"/>
    <rect x="160" y="112" width="40" height="10" rx="2" class="vdark"/>
    <rect x="118" y="130" width="124" height="9" rx="3" class="vdark"/>
    <rect x="132" y="137" width="24" height="13" rx="3" class="vtire"/>
    <rect x="204" y="137" width="24" height="13" rx="3" class="vtire"/>
  </g>`;

// Teilintegrierter von der Seite, Heck links, Front rechts
const SIDE_VAN = `
  <g class="van">
    <path d="M62 136 V66 Q62 56 72 56 H252 Q262 56 268 66 L284 100 Q300 104 302 116 V136 Z" class="vbody"/>
    <path d="M262 64 L280 100 H262 Z" class="vwin"/>
    <rect x="82" y="72" width="44" height="24" rx="4" class="vwin"/>
    <rect x="196" y="72" width="40" height="24" rx="4" class="vwin"/>
    <rect x="146" y="70" width="28" height="60" rx="4" class="vdoor"/>
    <rect x="62" y="128" width="240" height="8" class="vdark"/>
    <circle cx="112" cy="137" r="14" class="vtire"/>
    <circle cx="112" cy="137" r="6" class="vhub"/>
    <circle cx="258" cy="137" r="14" class="vtire"/>
    <circle cx="258" cy="137" r="6" class="vhub"/>
  </g>`;

const STYLE = `
  :host {
    --wl-green: #2e9e44;
    --wl-orange: #e58a1f;
    --wl-red: #d33b3b;
    --wl-bubble: #d8c6a4;
  }
  ha-card { padding: 12px 14px 14px; overflow: hidden; }
  .head { display:flex; align-items:center; justify-content:center; margin-bottom:6px; }
  .title { font-size: 1.15em; font-weight: 500; color: var(--primary-text-color); }
  .tabs { display:flex; gap:6px; margin-bottom:6px; }
  .tabs button {
    flex:1; border:none; background:transparent; padding:8px 4px; cursor:pointer;
    font: inherit; font-size: .95em; color: var(--secondary-text-color);
    border-bottom: 2px solid transparent;
  }
  .tabs button.on { color: var(--primary-text-color); font-weight:600; border-bottom-color: var(--primary-color, #03a9f4); }
  .panel { position:relative; margin-top:6px; }
  .ptitle { font-weight:600; color: var(--primary-text-color); }
  .angle { display:flex; align-items:center; gap:6px; color: var(--secondary-text-color); font-size:.95em; margin-top:2px; }
  .aicon { width:18px; height:14px; }
  .scene { width:100%; display:block; border-radius: 6px; }
  .side { font-size:12px; fill: var(--secondary-text-color); }
  .gtxt { font-size:16px; font-weight:600; fill:#fff; }
  .vbody { fill:#8d8d8d; }
  .vdark { fill:#6a6a6a; }
  .vwin { fill:#d9d9d9; }
  .vdoor { fill:#7b7b7b; }
  .vlight { fill:#b85a5a; }
  .vtire { fill:#3a3a3a; }
  .vhub { fill:#9a9a9a; }
  .outline { fill:none; stroke: var(--secondary-text-color); stroke-width:2; opacity:.55; }
  .outline.thin { stroke-width:1.2; }
  .vial { fill: rgba(127,127,127,.08); stroke: var(--secondary-text-color); stroke-width:1.5; opacity:.8; }
  .target { fill:none; stroke: var(--wl-green); stroke-width:1.5; stroke-dasharray:3 3; }
  .cross { stroke: var(--secondary-text-color); stroke-width:1.2; opacity:.6; }
  .topval { font-size:17px; font-weight:600; }
  .status { margin-top:10px; padding:10px 12px; border-radius:8px; color:#fff; font-size:.95em; line-height:1.5; }
  .status .sh { font-weight:600; margin-bottom:2px; }
  .status .li { display:flex; justify-content:space-between; border-top:1px solid rgba(255,255,255,.25); padding:3px 0; }
  .status.green { background: var(--wl-green); }
  .status.orange { background: var(--wl-orange); }
  .status.red { background: var(--wl-red); }
  .na { padding:30px; text-align:center; color: var(--secondary-text-color); }
`;

customElements.define("womo-level-card", WomoLevelCard);
window.customCards = window.customCards || [];
window.customCards.push({
  type: "womo-level-card",
  name: "Womo Wasserwaage",
  description: "Rück-, Seiten- und Draufsicht mit Keilhöhen pro Rad",
});

const card = document.getElementById("card");
card.setConfig({ pitch_entity:"sensor.p", roll_entity:"sensor.r", title:"Benimar Tessoro 488", wheelbase:395, track:170 });
const p = document.getElementById("p"), r = document.getElementById("r");
function upd() {
  document.getElementById("po").textContent = Number(p.value).toFixed(1) + "°";
  document.getElementById("ro").textContent = Number(r.value).toFixed(1) + "°";
  card.hass = { states: { "sensor.p": {state:p.value}, "sensor.r": {state:r.value} } };
}
p.oninput = r.oninput = upd;
document.querySelectorAll("button[data-p]").forEach(b => b.onclick = () => { p.value=b.dataset.p; r.value=b.dataset.r; upd(); });
document.getElementById("dark").onclick = () => document.body.classList.toggle("dark");
upd();
</script>
</body></html>
